<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .card { border: 1px solid #ccc; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .navigation a {margin-right: 10px; }
        input, select, button {margin: 5px; }
    </style>

    <title>Meal Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Meal Planner <img class="title-icon" src="images/avocado.png" alt=""></h1>
    <div class="container">

        <div class="navigation">
            <a href="index.html">Nutrition Search</a>
            <a href="planner.html">Meal Planner</a>
        </div>

        <!-- ADD MEAL-->

        <div class="card">
            <h2>Add New Meal</h2>

            <input type="text" id="mealName" placeholder="Enter food name">

            <input type="number" id="mealCalories" placeholder="Enter calories">

            <select id="dietPlan">
                <option value="Weight Loss">
                    Weight Loss
                </option>

                <option value="Muscle Builder">
                    Muscle Builder
                </option>

                <option value="Balanced Diet">
                    Balanced Diet / Healthy Lifestyle
                </option>
            </select>

            <button id="addButton">
                Add Meal
            </button>
        </div>

        <!--SAVED MEALS RECORDS-->

        <div class="card">
            <h2>Saved Meals</h2>

            <div id="listMeals">
                <!--Based on planner.js-->
            </div>
        </div>

        <!--CALCULATE CALORIES-->

        <div class="card">

            <h2>Nutrition Summary</h2>

            <p id="totalCalories">
                <!--Based on planner.js-->
        
            </p>
        </div>
        
    </div>

    <script src="planner.js"></script>
</body>
</html>
